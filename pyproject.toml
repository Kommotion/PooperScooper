[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pooperscooper"
version = "2.5.0"
description = "Personal Discord bot for music, gametime, image generation, and more."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py[voice]>=2.7.0",
    "wavelink>=3.5",
    "yt-dlp",
    "requests",
    "Pillow",
    "pydantic>=2.0",
]

[project.optional-dependencies]
bingo = [
    "pandas",
    "matplotlib",
]
image = [
    "numpy",
    "scipy",
    "safetensors",
]
palworld = [
    "loguru",
]
all = [
    "pandas",
    "matplotlib",
    "numpy",
    "scipy",
    "safetensors",
    "loguru",
]

[tool.setuptools]
packages = ["cogs"]